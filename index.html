<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Your App Factory · Studio</title><style>
:root{--nav:#111827;--nav2:#1f2937;--bg:#f4f6fb;--panel:#fff;--text:#182237;--muted:#69778d;--line:#e5e9f1;--primary:#635bdf;--primary2:#5148c7;--green:#09865e;--red:#b43c45;--shadow:0 8px 26px #17213b0a}*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#app{display:flex;min-height:100vh}.sidebar{background:var(--nav);width:248px;color:#cbd5e1;flex-shrink:0;padding:22px 13px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:0 10px 30px}.brandicon{background:#6d63ed;color:white;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:26px}.brand strong{display:block;color:white;font-size:14px}.brand small{font-size:10px;letter-spacing:1px;color:#91a0b7}nav button{display:block;border:0;background:transparent;color:#b5c0d2;padding:13px 14px;width:100%;text-align:left;border-radius:10px;margin:3px 0}nav button:hover,nav button.active{background:var(--nav2);color:#fff}nav button.active{box-shadow:inset 3px 0 #887cff}.sidebarfoot{margin-top:auto;border-top:1px solid #293345;padding:16px 10px;font-size:12px}.sidebarfoot small{color:#8fa0b8}.workspace{min-width:0;flex:1}header{background:white;height:70px;display:flex;align-items:center;gap:15px;padding:0 30px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.right{margin-left:auto;color:#7b879a;font-size:11px;display:flex;align-items:center;gap:15px}.avatar{background:#e9e7ff;color:#5148c7;border-radius:50%;width:33px;height:33px;display:grid;place-items:center;font-weight:800}main{padding:30px;max-width:1480px;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.hero h1{font-size:27px;margin:2px 0 5px;letter-spacing:-.6px}.hero p{margin:0;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:800;color:var(--primary);text-transform:uppercase}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px;color:var(--text);font-weight:650}.btn:hover{border-color:#aaa3fa}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.primary:hover{background:var(--primary2)}.btn.danger{color:var(--red)}.btn.small{padding:6px 10px;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel,.appcard{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:19px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:29px;margin-top:8px}.sectiontop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 13px}.sectiontop h2{font-size:17px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.appcard{padding:18px}.appcard .icon{width:45px;height:45px;border-radius:12px;background:#eeecff;display:grid;place-items:center;font-size:24px}.appcard h3{margin:13px 0 5px;font-size:16px}.appcard p{font-size:12px;color:var(--muted);min-height:39px;margin:0}.cardhead,.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:10px}.cardfoot{border-top:1px solid var(--line);padding-top:13px;margin-top:15px}.pill{padding:4px 9px;border-radius:20px;background:#e8f8f0;color:#078259;font-size:11px;font-weight:750}.pill.private{background:#eef1f7;color:#64748b}.pill.draft{background:#fff4df;color:#9a6518}.tag{display:inline-block;background:#f1f3f8;border-radius:6px;padding:3px 8px;font-size:11px;color:#637086;margin-top:10px}.panel{padding:20px}.panel h2,.panel h3{margin:0 0 13px}.muted{color:var(--muted)}.note{background:#fff9e9;color:#8b6725;border:1px solid #f4e5bc;padding:13px;border-radius:10px;margin-bottom:18px}.noticegood{background:#eaf8f0;color:#13744d;border:1px solid #d4f0e1;padding:12px;border-radius:10px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #dce2ed;border-radius:9px;background:white;outline:none;color:var(--text)}.field textarea{min-height:74px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8980ec;box-shadow:0 0 0 3px #625bdf1a}.field.full{grid-column:1/-1}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:17px}.buildertabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:17px}.buildertabs button{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px}.buildertabs button.active{background:#ebe9ff;border-color:#b8b2ff;color:#5148c7;font-weight:800}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}table{border-collapse:collapse;width:100%;min-width:520px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:11px 13px;font-size:12px}th{background:#f9fafe;color:#66758b}tr:last-child td{border:0}.empty{border:1px dashed #cdd5e2;border-radius:11px;background:white;padding:35px;text-align:center;color:var(--muted)}.listitem{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;background:white}.listitem small{color:var(--muted)}.widget{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.widget strong{font-size:23px}.widgets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.previewframe{background:#f5f7fb;border:1px solid var(--line);border-radius:12px;padding:17px;min-height:280px}.previewframe h2{margin:0 0 4px}.previewnav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.previewnav span{font-size:11px;background:#e9e8ff;color:#5148c7;border-radius:7px;padding:6px 9px}.help{font-size:12px;color:var(--muted)}#toast{position:fixed;bottom:22px;right:22px;background:#1b293c;color:white;border-radius:10px;padding:12px 18px;box-shadow:0 12px 30px #0003;display:none;z-index:9;max-width:350px}.mobile{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}.selectwide{max-width:400px}.dangertext{color:var(--red)}.code{font:12px ui-monospace,monospace;background:#f3f5f9;padding:3px 5px;border-radius:4px}.hide{display:none!important}@media(max-width:1150px){.grid{grid-template-columns:repeat(2,1fr)}.widgets{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.sidebar{position:fixed;top:0;bottom:0;left:-255px;z-index:10;transition:left .2s}.sidebar.open{left:0}.mobile{display:block}.layout,.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:570px){main{padding:17px}header{padding:0 15px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:23px}.grid,.widgets,.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.right{font-size:0}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}}

</style></head><body>
<div id="app"><aside class="sidebar"><div class="brand"><div class="brandicon">✦</div><div><strong>YOUR APP FACTORY</strong><small>NO-CODE STUDIO · V2</small></div></div><nav id="nav"><button data-page="home" class="active">◫ &nbsp; Overview</button><button data-page="apps">▦ &nbsp; My Applications</button><button data-page="builder">✧ &nbsp; App Builder</button><button data-page="market">◇ &nbsp; Marketplace Preview</button><button data-page="settings">⚙ &nbsp; Settings & Backup</button></nav><div class="sidebarfoot">● Local prototype<br><small>No cloud connection</small></div></aside><div class="workspace"><header><button id="menu" class="mobile">☰</button><b id="pagetitle">Overview</b><span class="right">OWNER WORKSPACE <span class="avatar">A</span></span></header><main id="content"></main></div></div><div id="toast" role="status" aria-live="polite"></div><input type="file" id="importfile" accept="application/json,.json" hidden><script>
/* Your App Factory V2 — browser-only no-code prototype. No remote services. */
(()=>{'use strict';
const KEY='yaf_v2',OLD='appFactoryProjects_v1';
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const types=['Library','Retail','School','Restaurant','Service','Finance','Productivity','Healthcare','Custom'];
const icons={Library:'📚',Retail:'🛒',School:'🎓',Restaurant:'🍽️',Service:'🛠️',Finance:'🧮',Productivity:'🗓️',Healthcare:'🏥',Custom:'🧩'};
const templates={Library:[{name:'Books',fields:[['Title','text'],['Author','text'],['ISBN','text'],['Available','number']]},{name:'Members',fields:[['Name','text'],['Phone','text'],['Joined','date']]},{name:'Issue Register',fields:[['Book','text'],['Member','text'],['Due Date','date'],['Returned','checkbox']]}],Retail:[{name:'Products',fields:[['Product Name','text'],['SKU','text'],['Price','number'],['Stock','number']]},{name:'Customers',fields:[['Name','text'],['Phone','text']]},{name:'Sales',fields:[['Product','text'],['Quantity','number'],['Total','number']]}],School:[{name:'Students',fields:[['Name','text'],['Class','text'],['Roll No','text']]},{name:'Fees',fields:[['Student','text'],['Amount','number'],['Paid','checkbox']]}],Restaurant:[{name:'Menu',fields:[['Item','text'],['Price','number'],['Available','checkbox']]},{name:'Orders',fields:[['Table','text'],['Item','text'],['Quantity','number'],['Status','text']]}],Service:[{name:'Clients',fields:[['Name','text'],['Contact','text']]},{name:'Jobs',fields:[['Title','text'],['Client','text'],['Status','text'],['Due','date']]}],Finance:[{name:'Calculations',fields:[['Label','text'],['Amount','number'],['Date','date']]}],Productivity:[{name:'Events',fields:[['Event','text'],['Date','date'],['Notes','textarea']]},{name:'Tasks',fields:[['Task','text'],['Completed','checkbox']]}],Healthcare:[{name:'Appointments',fields:[['Patient','text'],['Date','date'],['Time','text']] }],Custom:[]};
const defaultState=()=>({version:2,apps:[],activity:[]});let state=defaultState(),page='home',selected=null,tab='overview',entity=null,query='',filter='All';
function normalize(s){if(!s||!Array.isArray(s.apps))throw Error('Invalid backup');return {version:2,apps:s.apps.map(a=>({id:String(a.id||uid()),name:String(a.name||'Untitled'),type:types.includes(a.type)?a.type:'Custom',description:String(a.description||a.desc||''),visibility:['Draft','Private','Public'].includes(a.visibility)?a.visibility:'Draft',paid:!!a.paid,created:a.created||now(),entities:Array.isArray(a.entities)?a.entities.map(e=>({id:String(e.id||uid()),name:String(e.name||'Records'),fields:Array.isArray(e.fields)?e.fields.map(f=>({id:String(f.id||uid()),name:String(f.name||'Field'),type:['text','number','date','checkbox','textarea','email'].includes(f.type)?f.type:'text',required:!!f.required})):[],records:Array.isArray(e.records)?e.records.map(r=>({id:String(r.id||uid()),values:r.values&&typeof r.values==='object'&&!Array.isArray(r.values)?r.values:{}})):[]})):[],widgets:Array.isArray(a.widgets)?a.widgets.filter(w=>['count','text','date'].includes(w.type)).map(w=>({id:String(w.id||uid()),type:w.type,title:String(w.title||'Widget'),entityId:String(w.entityId||''),text:String(w.text||'')})):[]})),activity:Array.isArray(s.activity)?s.activity.slice(0,30):[]};}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Browser storage is full or blocked. Export your backup.');return false}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){state=normalize(JSON.parse(raw));return}const old=localStorage.getItem(OLD);if(old){const legacy=JSON.parse(old);if(Array.isArray(legacy)){state=normalize({apps:legacy,activity:[]});persist();return}}}catch(e){console.warn('Could not load saved data',e);toast('Could not read saved data. Do not overwrite it; export or inspect browser storage.')}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',3800)}
function activity(msg){state.activity.unshift({id:uid(),text:msg,date:now()});state.activity=state.activity.slice(0,30)}
function findApp(){return state.apps.find(a=>a.id===selected)}function findEntity(){const a=findApp();return a?.entities.find(e=>e.id===entity)}
function button(text,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${text}</button>`}
function options(list,chosen){return list.map(x=>`<option value="${esc(x)}" ${x===chosen?'selected':''}>${esc(x)}</option>`).join('')}
function header(title,sub,actions=''){return `<div class="hero"><div><div class="eyebrow">YOUR APP FACTORY</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><div class="row">${actions}</div></div>`}
function appCard(a){return `<article class="appcard"><div class="cardhead"><div class="icon">${icons[a.type]||'📱'}</div><span class="pill ${a.visibility.toLowerCase()}">${esc(a.visibility)}</span></div><h3>${esc(a.name)}</h3><p>${esc(a.description||'Your custom application workspace.')}</p><span class="tag">${esc(a.type)}</span> <span class="tag">${a.entities.length} collections</span> ${a.paid?'<span class="tag">Paid concept</span>':''}<div class="cardfoot"><small class="muted">${a.widgets.length} dashboard widgets</small>${button('Open Studio →','open:'+a.id,'small primary')}</div></article>`}
function home(){const apps=state.apps;return header('Welcome to your App Factory 👋','Build and manage customizable apps without writing code.',button('＋ Create New App','new','primary'))+`<div class="stats"><div class="stat"><span>Total Apps</span><strong>${apps.length}</strong></div><div class="stat"><span>Public</span><strong>${apps.filter(a=>a.visibility==='Public').length}</strong></div><div class="stat"><span>Private</span><strong>${apps.filter(a=>a.visibility==='Private').length}</strong></div><div class="stat"><span>Draft</span><strong>${apps.filter(a=>a.visibility==='Draft').length}</strong></div></div><div class="sectiontop"><h2>Recent Applications</h2>${button('View all →','page:apps','small')}</div><div class="grid">${apps.slice(0,6).map(appCard).join('')||'<div class="empty">No apps yet. Start by creating a new app from a template.</div>'}</div><div class="sectiontop"><h2>Recent Activity</h2></div><div class="panel">${state.activity.slice(0,6).map(x=>`<div class="listitem"><span>${esc(x.text)}</span><small>${new Date(x.date).toLocaleString()}</small></div>`).join('')||'<p class="muted">Your activity will appear here.</p>'}</div>`}
function appsPage(){const list=state.apps.filter(a=>(a.name+' '+a.type+' '+a.description).toLowerCase().includes(query.toLowerCase())&&(filter==='All'||a.visibility===filter));return header('My Applications','All your projects and app workspaces.',button('＋ New App','new','primary'))+`<div class="row" style="margin-bottom:17px"><input id="search" class="btn" placeholder="Search apps..." value="${esc(query)}" aria-label="Search apps"><select id="filter" class="btn" aria-label="Filter apps">${options(['All','Draft','Private','Public'],filter)}</select></div><div class="grid">${list.map(appCard).join('')||'<div class="empty">No matching apps.</div>'}</div>`}
function market(){return header('Marketplace Preview','Only Public apps are listed here. This is not an online store.')+`<div class="note">Public/Private currently controls only this prototype’s lists. It is NOT real access security or internet publishing.</div><div class="grid">${state.apps.filter(a=>a.visibility==='Public').map(appCard).join('')||'<div class="empty">No Public apps yet.</div>'}</div>`}
function settings(){return header('Settings & Backup','Protect your browser-based project data.')+`<div class="two"><div class="panel"><h2>Data Backup</h2><p class="muted">Your app designs and records are saved only in this browser. Export JSON frequently.</p><div class="row">${button('↓ Export Backup','export','primary')}${button('↑ Import Backup','import')}</div><p class="help">Import replaces all currently loaded projects after confirmation. Export first.</p></div><div class="panel"><h2>Security & Limitations</h2><p class="note">No login, backend, real publishing, payments, customer isolation, or cloud backups yet. Do not enter sensitive or real customer data.</p><p class="help">For real customers we must add secure authentication, server authorization, database tenant isolation, audit logs, payment verification, and deployment.</p></div></div>`}
function newPage(){return header('Create a New App','Choose a template or start from scratch.')+`<div class="panel"><div class="formgrid"><div class="field"><label>App Name *</label><input id="newname" maxlength="90" placeholder="e.g. My Library Manager"></div><div class="field"><label>Template</label><select id="newtype">${options(types,'Library')}</select></div><div class="field full"><label>Description</label><textarea id="newdesc" maxlength="500" placeholder="What should this app do?"></textarea></div><div class="field"><label>Visibility</label><select id="newvisibility">${options(['Draft','Private','Public'],'Draft')}</select></div><div class="field"><label>Business Model</label><select id="newpaid"><option value="free">Free concept</option><option value="paid">Paid concept (payments not connected)</option></select></div></div><hr class="divider"><div class="row">${button('Create App Workspace','create','primary')}${button('Cancel','page:apps')}</div></div><div class="note" style="margin-top:15px">Templates create editable data collections, not a standalone APK or a deployed website. Draft is recommended until reviewed.</div>`}
function makeEntity(spec){return {id:uid(),name:spec.name,fields:spec.fields.map(([name,type])=>({id:uid(),name,type,required:false})),records:[]}}
function create(){const name=$('#newname')?.value.trim();if(!name)return toast('Enter an app name.');const type=$('#newtype').value;const a={id:uid(),name,type,description:$('#newdesc').value.trim(),visibility:$('#newvisibility').value,paid:$('#newpaid').value==='paid',created:now(),entities:(templates[type]||[]).map(makeEntity),widgets:[{id:uid(),type:'text',title:'Welcome',text:'Manage your '+type+' workspace',entityId:''}]};state.apps.unshift(a);selected=a.id;entity=null;tab='overview';activity('Created '+name);persist();page='studio';render();toast('App workspace created.');}
function studio(){const a=findApp();if(!a){page='apps';return appsPage()}return header(a.name,a.description||'Customize your application.',`${button('← All Apps','page:apps')}${button('Preview App','tab:preview','primary')}`)+`<div class="note">This is a working browser-only app designer. Public status is a local label, not secure publishing. Export your data before replacing files or clearing browser storage.</div><div class="buildertabs">${[['overview','Dashboard'],['collections','Data Collections'],['records','Records'],['widgets','Widgets'],['preview','App Preview'],['details','App Settings']].map(([id,name])=>`<button data-action="tab:${id}" class="${tab===id?'active':''}">${name}</button>`).join('')}</div>${({overview:studioOverview,collections:studioCollections,records:studioRecords,widgets:studioWidgets,preview:studioPreview,details:studioDetails})[tab](a)}`}
function studioOverview(a){return `<div class="stats"><div class="stat"><span>Collections</span><strong>${a.entities.length}</strong></div><div class="stat"><span>Total Records</span><strong>${a.entities.reduce((n,e)=>n+e.records.length,0)}</strong></div><div class="stat"><span>Dashboard Widgets</span><strong>${a.widgets.length}</strong></div><div class="stat"><span>Visibility</span><strong style="font-size:20px">${a.visibility}</strong></div></div><div class="sectiontop"><h2>Dashboard Widgets</h2>${button('Manage Widgets','tab:widgets','small')}</div>${widgetsView(a)}<div class="sectiontop"><h2>Data Collections</h2>${button('Manage Collections','tab:collections','small')}</div><div class="grid">${a.entities.map(e=>`<div class="panel"><h3>${esc(e.name)}</h3><p class="muted">${e.fields.length} fields · ${e.records.length} records</p>${button('Open Records','entity:'+e.id,'small')}</div>`).join('')||'<div class="empty">No collections yet.</div>'}</div>`}
function studioCollections(a){return `<div class="layout"><div class="panel"><h3>Create Collection</h3><p class="help">Example: Books, Members, Products, Students.</p><div class="field"><label>Collection Name</label><input id="entityname" maxlength="60" placeholder="e.g. Books"></div>${button('＋ Add Collection','addentity','primary')}<hr class="divider"><p class="help">Choose a collection to add fields.</p>${a.entities.map(e=>`<div class="listitem"><div><b>${esc(e.name)}</b><br><small>${e.fields.length} fields</small></div>${button('Edit','entity:'+e.id,'small')}</div>`).join('')}</div><div class="panel">${collectionEditor(a)}</div></div>`}
function collectionEditor(a){const e=findEntity()||a.entities[0];if(!e)return '<div class="empty">Create a collection to start.</div>';entity=e.id;return `<div class="sectiontop" style="margin-top:0"><h2>${esc(e.name)} · Fields</h2>${button('Delete Collection','deleteentity:'+e.id,'small danger')}</div><div class="tablewrap"><table><thead><tr><th>Field Name</th><th>Type</th><th>Required</th><th></th></tr></thead><tbody>${e.fields.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.type)}</td><td>${f.required?'Yes':'No'}</td><td>${button('Remove','deletefield:'+f.id,'small danger')}</td></tr>`).join('')||'<tr><td colspan="4">No fields yet.</td></tr>'}</tbody></table></div><h3 style="margin-top:20px">Add a Field</h3><div class="formgrid"><div class="field"><label>Field Name</label><input id="fieldname" maxlength="60" placeholder="e.g. Book Title"></div><div class="field"><label>Field Type</label><select id="fieldtype">${options(['text','number','date','checkbox','textarea','email'],'text')}</select></div></div><label class="check"><input type="checkbox" id="fieldrequired"> Required field</label><div style="margin-top:12px">${button('＋ Add Field','addfield','primary')}</div><p class="help">Removing a field also removes its values from existing records. Export a backup first.</p>`}
function studioRecords(a){const e=findEntity()||a.entities[0];if(e)entity=e.id;return `<div class="panel"><div class="sectiontop" style="margin-top:0"><h2>Manage Records</h2><select id="entityselect" class="btn">${a.entities.map(x=>`<option value="${esc(x.id)}" ${x.id===entity?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${!e?'<div class="empty">Create a collection first.</div>':`<div class="two"><div><h3>Add New Record</h3>${e.fields.length?e.fields.map(f=>`<div class="field"><label>${esc(f.name)}${f.required?' *':''}</label>${f.type==='textarea'?`<textarea data-recordfield="${esc(f.id)}"></textarea>`:f.type==='checkbox'?`<label class="check"><input type="checkbox" data-recordfield="${esc(f.id)}"> Yes</label>`:`<input data-recordfield="${esc(f.id)}" type="${f.type==='number'?'number':f.type==='date'?'date':f.type==='email'?'email':'text'}" ${f.required?'required':''}>`}</div>`).join('')+button('＋ Save Record','addrecord','primary'):'<p class="help">Add fields in Data Collections first.</p>'}</div><div><h3>Saved Records (${e.records.length})</h3><div class="tablewrap"><table><thead><tr>${e.fields.map(f=>`<th>${esc(f.name)}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${e.records.map(r=>`<tr>${e.fields.map(f=>`<td>${esc(f.type==='checkbox'?(r.values[f.id]?'Yes':'No'):(r.values[f.id]??''))}</td>`).join('')}<td>${button('Delete','deleterecord:'+r.id,'small danger')}</td></tr>`).join('')||`<tr><td colspan="${e.fields.length+1}">No records yet.</td></tr>`}</tbody></table></div></div></div>`}</div>`}
function widgetsView(a){return `<div class="widgets">${a.widgets.map(w=>{const e=a.entities.find(x=>x.id===w.entityId);return `<div class="widget"><div class="cardhead"><small class="muted">${esc(w.type.toUpperCase())}</small>${button('×','deletewidget:'+w.id,'small danger')}</div><h3>${esc(w.title)}</h3>${w.type==='count'?`<strong>${e?.records.length??0}</strong><p class="help">${esc(e?.name||'Choose a collection')}</p>`:w.type==='date'?`<strong style="font-size:18px">${new Date().toLocaleDateString()}</strong>`:`<p>${esc(w.text)}</p>`}</div>`}).join('')||'<div class="empty">No widgets. Add one below.</div>'}</div>`}
function studioWidgets(a){return `<div class="panel"><h2>Dashboard Widgets</h2>${widgetsView(a)}<hr class="divider"><h3>Add Widget</h3><div class="formgrid"><div class="field"><label>Title</label><input id="widgettitle" placeholder="e.g. Total Books"></div><div class="field"><label>Widget Type</label><select id="widgettype">${options(['count','text','date'],'count')}</select></div><div class="field"><label>Collection (for Count)</label><select id="widgetentity"><option value="">None</option>${a.entities.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Text (for Text Widget)</label><input id="widgettext" placeholder="Welcome message"></div></div>${button('＋ Add Widget','addwidget','primary')}</div>`}
function studioPreview(a){return `<div class="previewframe"><div class="cardhead"><div><div class="eyebrow">APP PREVIEW</div><h2>${esc(a.name)}</h2><p class="muted">${esc(a.description)}</p></div><span class="pill ${a.visibility.toLowerCase()}">${esc(a.visibility)}</span></div><div class="previewnav"><span>Dashboard</span>${a.entities.map(e=>`<span>${esc(e.name)}</span>`).join('')}</div>${widgetsView(a)}<div class="sectiontop"><h2>Collections Preview</h2></div><div class="grid">${a.entities.map(e=>`<div class="panel"><h3>${esc(e.name)}</h3><p>${e.records.length} records · ${e.fields.length} fields</p></div>`).join('')||'<div class="empty">No collections configured.</div>'}</div></div><p class="help">Preview is rendered within App Factory; one-click standalone app generation, URL publishing and APK export are not implemented yet.</p>`}
function studioDetails(a){return `<div class="panel"><h2>App Settings</h2><div class="formgrid"><div class="field"><label>App Name</label><input id="editname" value="${esc(a.name)}" maxlength="90"></div><div class="field"><label>Category</label><select id="edittype">${options(types,a.type)}</select></div><div class="field full"><label>Description</label><textarea id="editdesc" maxlength="500">${esc(a.description)}</textarea></div><div class="field"><label>Visibility</label><select id="editvisibility">${options(['Draft','Private','Public'],a.visibility)}</select></div><div class="field"><label>Payment Concept</label><select id="editpaid"><option value="free" ${!a.paid?'selected':''}>Free</option><option value="paid" ${a.paid?'selected':''}>Paid (not connected)</option></select></div></div><p class="help">Changing to Public only makes the app appear in the local Marketplace Preview.</p><div class="row">${button('Save Changes','saveapp','primary')}${button('Duplicate App','duplicate')}${button('Delete App','deleteapp','danger')}</div></div>`}
function render(){const labels={home:'Overview',apps:'My Applications',new:'Create Application',studio:'App Builder',market:'Marketplace Preview',settings:'Settings & Backup'};$('#pagetitle').textContent=labels[page];$('#content').innerHTML=({home,apps:appsPage,new:newPage,studio,market,settings})[page]();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='studio'&&b.dataset.page==='builder')||(page==='new'&&b.dataset.page==='builder')));$('#nav').parentElement.classList.remove('open')}
function navigate(p){if(p==='builder')p='new';page=p;render();window.scrollTo(0,0)}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='app-factory-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Backup downloaded. Keep it safe.')}
function dispatch(action){const a=findApp(),e=findEntity();if(action.startsWith('page:'))return navigate(action.slice(5));if(action.startsWith('open:')){selected=action.slice(5);entity=null;tab='overview';page='studio';return render()}if(action.startsWith('tab:')){tab=action.slice(4);return render()}if(action.startsWith('entity:')){entity=action.slice(7);tab=tab==='overview'?'records':tab;return render()}if(action==='new')return navigate('new');if(action==='create')return create();if(action==='export')return exportBackup();if(action==='import')return $('#importfile').click();if(!a)return;
if(action==='addentity'){const name=$('#entityname')?.value.trim();if(!name)return toast('Enter collection name.');if(a.entities.some(x=>x.name.toLowerCase()===name.toLowerCase()))return toast('Collection name already exists.');const x={id:uid(),name,fields:[],records:[]};a.entities.push(x);entity=x.id;activity('Added collection '+name+' to '+a.name)}
else if(action.startsWith('deleteentity:')){const id=action.slice(13);if(!confirm('Delete this collection and ALL its records? Export backup first.'))return;a.entities=a.entities.filter(x=>x.id!==id);a.widgets=a.widgets.map(w=>w.entityId===id?{...w,entityId:''}:w);entity=null;activity('Deleted a collection from '+a.name)}
else if(action==='addfield'){if(!e)return;const name=$('#fieldname')?.value.trim();if(!name)return toast('Enter field name.');if(e.fields.some(x=>x.name.toLowerCase()===name.toLowerCase()))return toast('Field name already exists.');e.fields.push({id:uid(),name,type:$('#fieldtype').value,required:$('#fieldrequired').checked});activity('Added field '+name+' to '+e.name)}
else if(action.startsWith('deletefield:')){if(!e)return;const id=action.slice(12);if(!confirm('Delete field and all its stored values?'))return;e.fields=e.fields.filter(f=>f.id!==id);e.records.forEach(r=>delete r.values[id]);activity('Deleted field in '+e.name)}
else if(action==='addrecord'){if(!e)return;const values={};for(const f of e.fields){const input=[...document.querySelectorAll('[data-recordfield]')].find(x=>x.dataset.recordfield===f.id);if(!input)continue;const v=f.type==='checkbox'?input.checked:input.value.trim();if(f.required&&(v===''||v===null))return toast('Required field: '+f.name);if(f.type==='number'&&v!==''&&!Number.isFinite(Number(v)))return toast('Invalid number: '+f.name);values[f.id]=f.type==='number'&&v!==''?Number(v):v}e.records.push({id:uid(),values});activity('Added record to '+e.name)}
else if(action.startsWith('deleterecord:')){if(!e||!confirm('Delete this record?'))return;e.records=e.records.filter(r=>r.id!==action.slice(13));activity('Deleted record from '+e.name)}
else if(action==='addwidget'){const title=$('#widgettitle').value.trim();if(!title)return toast('Enter widget title.');a.widgets.push({id:uid(),title,type:$('#widgettype').value,entityId:$('#widgetentity').value,text:$('#widgettext').value.trim()});activity('Added widget to '+a.name)}
else if(action.startsWith('deletewidget:')){a.widgets=a.widgets.filter(w=>w.id!==action.slice(13));activity('Removed widget from '+a.name)}
else if(action==='saveapp'){const name=$('#editname').value.trim();if(!name)return toast('App name is required.');a.name=name;a.type=$('#edittype').value;a.description=$('#editdesc').value.trim();a.visibility=$('#editvisibility').value;a.paid=$('#editpaid').value==='paid';activity('Updated '+name)}
else if(action==='duplicate'){const copy=JSON.parse(JSON.stringify(a));copy.id=uid();copy.name+=' (Copy)';copy.visibility='Draft';copy.created=now();state.apps.unshift(copy);selected=copy.id;entity=null;tab='overview';activity('Duplicated '+a.name)}
else if(action==='deleteapp'){if(!confirm('Permanently delete this app and its records from this browser? Export a backup first.'))return;state.apps=state.apps.filter(x=>x.id!==a.id);activity('Deleted '+a.name);selected=null;page='apps'}
else return;
persist();render();toast('Changes saved locally.');}
$('#content').addEventListener('click',ev=>{const btn=ev.target.closest('[data-action]');if(btn)dispatch(btn.dataset.action)});
$('#content').addEventListener('input',ev=>{if(ev.target.id==='search'){query=ev.target.value;const pos=ev.target.selectionStart;render();const s=$('#search');s?.focus();s?.setSelectionRange(pos,pos)}});
$('#content').addEventListener('change',ev=>{if(ev.target.id==='filter'){filter=ev.target.value;render()}if(ev.target.id==='entityselect'){entity=ev.target.value;render()}});
$('#nav').addEventListener('click',ev=>{const b=ev.target.closest('[data-page]');if(b)navigate(b.dataset.page)});
$('#menu').addEventListener('click',()=>$('.sidebar').classList.toggle('open'));
$('#importfile').addEventListener('change',async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;try{if(file.size>5e6)throw Error('Backup exceeds 5 MB limit');const candidate=normalize(JSON.parse(await file.text()));if(!confirm(`Import ${candidate.apps.length} apps? This will REPLACE all current apps and records. Export a backup first.`))return;const before=state;state=candidate;if(!persist()){state=before;return}selected=null;entity=null;page='home';render();toast('Backup imported successfully.')}catch(err){toast('Import failed: '+err.message)}});
load();render();
})();

</script></body></html>
